# Copy to secret.yaml (gitignored) and fill in real values:
#   cp ovh/k8s/secret.example.yaml ovh/k8s/secret.yaml
# Or create imperatively (preferred, keeps secrets out of git):
#   kubectl create secret generic backend-secrets \
#     --namespace how-to-be-human \
#     --from-literal=SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
#     --dry-run=client -o yaml | kubectl apply -f -
# Registry pull secret (required: OVHcloud Managed Private Registry is private):
#   kubectl create secret docker-registry registry-credentials \
#     --namespace how-to-be-human \
#     --docker-server="$OVH_REGISTRY_URL" \
#     --docker-username="$OVH_REGISTRY_USER" \
#     --docker-password="$OVH_REGISTRY_PASSWORD" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: how-to-be-human
type: Opaque
stringData:
  SECRET_KEY: REPLACE_WITH_SECURE_RANDOM_VALUE
