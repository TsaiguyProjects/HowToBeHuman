apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: how-to-be-human
  labels:
    app.kubernetes.io/name: how-to-be-human-backend
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pulls from OVHcloud Managed Private Registry (Harbor), which is
      # private by default. deploy.sh creates this secret from
      # OVH_REGISTRY_URL / OVH_REGISTRY_USER / OVH_REGISTRY_PASSWORD.
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backend
          # NOTE: deploy.sh / CI rewrites this image to
          # <OVH_REGISTRY_URL>/<HARBOR_PROJECT>/backend:<TAG>.
          # The placeholder below is only for first-time `kubectl apply --dry-run`.
          image: REPLACE_WITH_REGISTRY_URL/how-to-be-human/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FLASK_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: how-to-be-human
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
