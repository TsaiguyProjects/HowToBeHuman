apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: how-to-be-human
  labels:
    app.kubernetes.io/name: how-to-be-human-frontend
    app: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # See backend.yaml: OVHcloud Managed Private Registry is private,
      # so pods pull via the `registry-credentials` docker-registry secret.
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: frontend
          # NOTE: deploy.sh / CI rewrites this image to
          # <OVH_REGISTRY_URL>/<HARBOR_PROJECT>/frontend:<TAG>.
          image: REPLACE_WITH_REGISTRY_URL/how-to-be-human/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: how-to-be-human
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
