version: '3.8'

services:
  # Production-like containers (built from Dockerfiles)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key
    volumes:
      - ./backend:/app
    # Use uv run for development with auto-reload
    command: uv run python app.py

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080

  # Development containers with hot reload
  backend-dev:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key
    command: >
      sh -c "
        pip install uv &&
        uv sync --all-groups &&
        uv run python app.py
      "
    profiles:
      - dev

  frontend-dev:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm run dev -- --host 0.0.0.0
      "
    profiles:
      - dev