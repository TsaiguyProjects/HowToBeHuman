services:
  # Production-like containers (built from Dockerfiles)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
    volumes:
      - ./backend:/app
    # Use uv run for development with auto-reload
    command: uv run --no-sync python app.py

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080

  # Development containers with hot reload
  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
    command: uv run --no-sync python app.py
    profiles:
      - dev

  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
    command: >
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm run dev -- --host 0.0.0.0
      "
    profiles:
      - dev

