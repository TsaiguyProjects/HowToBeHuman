# Digital Ocean App Platform Spec
# Deploy with: doctl apps create --spec .do/app.yaml
name: how-to-be-human
region: nyc3

services:
  # Backend API Service (Dockerfile-based so production uses uv, same as local)
  # NOTE: source_dir is repo root so the Docker build context matches docker-compose
  - name: backend
    source_dir: /
    github:
      repo: TsaiguyProjects/HowToBeHuman
      branch: main
    dockerfile_path: backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: SECRET_KEY
        value: ${SECRET_KEY}
        type: SECRET
      - key: FLASK_ENV
        value: production

  # Frontend Service (serves React app + proxies API to backend)
  # NOTE: source_dir is repo root so the Docker build context matches docker-compose
  - name: frontend
    source_dir: /
    github:
      repo: TsaiguyProjects/HowToBeHuman
      branch: main
    dockerfile_path: frontend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 80
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 10
    routes:
      - path: /api/*
        service: backend

# Databases (optional - add if needed)
