name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Run tests
        run: uv run pytest -v || echo "No tests configured"
      - name: Coverage gate (100%)
        run: uv run pytest -m "not e2e" --cov=app --cov-report=term-missing --cov-fail-under=100
      - name: Lint
        run: uv run ruff check . || echo "Lint issues found"
      - name: Type check
        run: uv run mypy . || echo "Type issues found"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Test
        run: pnpm test
      - name: Coverage gate (100%)
        run: pnpm coverage
      - name: Build
        run: pnpm run build
      - name: Lint
        run: pnpm run lint || echo "No linter configured"
      - name: Type check
        run: pnpm run typecheck

  playwright-e2e:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start app stack
        run: docker compose up -d --build
      - name: Wait for app health
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
      - name: Run Playwright tests
        run: pnpm exec playwright test
        working-directory: frontend
      - name: Stop app stack
        if: always()
        run: docker compose down

  deploy:
    needs: [test-backend, test-frontend, playwright-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to App Platform
        run: |
          doctl apps create --spec .do/app.yaml || \
          doctl apps update $(doctl apps list --format ID,Spec.Name --no-header | grep how-to-be-human | awk '{print $1}') --spec .do/app.yaml
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}