name: CI/CD Pipeline

on:
  push:
    branches: [main, ovhcloud]
  pull_request:
    branches: [main, ovhcloud]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Run tests
        run: uv run pytest -v || echo "No tests configured"
      - name: Coverage gate (100%)
        run: uv run pytest -m "not e2e" --cov=app --cov-report=term-missing --cov-fail-under=100
      - name: Lint
        run: uv run ruff check . || echo "Lint issues found"
      - name: Type check
        run: uv run mypy . || echo "Type issues found"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
