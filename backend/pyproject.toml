[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "how-to-be-human-backend"
version = "1.0.0"
description = "Flask backend for HowToBeHuman"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "gunicorn==23.0.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.0",
    "black==24.8.0",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "mypy==1.11.2",
    "testcontainers==4.15.0",
    "requests==2.34.2",
]

# uv dependency groups (modern way, mirrors optional-dependencies)
# Install with: uv sync --group dev  OR  uv sync --all-groups
[dependency-groups]
dev = [
    "ruff==0.17.0",
    "black==24.8.0",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "mypy==1.11.2",
    "testcontainers==4.15.0",
    "requests==2.34.2",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | __pycache__
  | venv
  | env
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, ANN: annotations (enforces type hints
# on all functions), UP: pyupgrade, I: import sorting
# (ANN101/ANN102 for self/cls are skipped by ruff by default)
select = ["E", "F", "ANN", "UP", "I"]

[tool.ruff.lint.flake8-annotations]
# Warn on `-> None` instead of no return annotation (explicit is better)
mypy-init-return = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Enforce type hints on all functions
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
ignore_missing_imports = true
exclude = [
    "venv",
    "env",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests against real production Docker images (requires Docker daemon)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
# Coverage gate: `make test-backend-coverage` and CI fail below this.
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]